name: RecipeRelay CI/CD

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

jobs:
  backend-test-and-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reciperelay
          POSTGRES_USER: reciperelay_user
          POSTGRES_PASSWORD: reciperelay_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      USE_SQLITE: "false"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: reciperelay
      DB_USER: reciperelay_user
      DB_PASSWORD: reciperelay_test_password
      DB_HOST: localhost
      DB_PORT: 5432
      LLM_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint backend with flake8
        run: flake8 src/backend/recipes tests/backend --max-line-length=120 --exclude=migrations
      - name: Run Django migrations & backend tests with coverage
        run: |
          python src/backend/manage.py migrate --noinput
          coverage run -m pytest
          coverage report -m
          coverage xml -o coverage.xml
      - name: Run 40-case substitution safety evaluation
        run: python tests/evaluate_substitutions.py
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install, test, and build React frontend
        working-directory: src/frontend
        run: |
          npm ci || npm install
          npm test
          npm run build

  sonarqube-scan:
    runs-on: ubuntu-latest
    needs: [backend-test-and-eval, frontend-build-and-test]
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
      - uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [backend-test-and-eval, frontend-build-and-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and frontend Docker images
        run: |
          docker build -t reciperelay-backend:ci -f Dockerfile .
          docker build -t reciperelay-frontend:ci -f src/frontend/Dockerfile .
